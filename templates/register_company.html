{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0">Company Registration</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Company Name *</label>
                            <input type="text" name="company_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">HR Contact Name *</label>
                            <input type="text" name="hr_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">HR Phone *</label>
                            <input type="tel" name="hr_phone" class="form-control" pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Email *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Password *</label>
                            <input type="password" name="password" class="form-control" minlength="6" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Website</label>
                            <input type="url" name="website" class="form-control" placeholder="https://...">
                        </div>
                        <div class="col-md-12 mb-4">
                            <label class="form-label fw-semibold">Company Description</label>
                            <textarea name="description" class="form-control" rows="3"
                                placeholder="Brief about your company..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit for Approval</button>
                </form>
            </div>
        </div>
        <p class="text-center text-muted small mt-3">
            Note: Company accounts need admin approval before login.<br>
            Already registered? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
