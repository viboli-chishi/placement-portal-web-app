{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4>Student Registration</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Full Name *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Email *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Password *</label>
                            <input type="password" name="password" class="form-control" minlength="6" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Roll Number *</label>
                            <input type="text" name="roll_number" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Branch *</label>
                            <input type="text" name="branch" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Year *</label>
                            <select name="year" class="form-control" required>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>CGPA *</label>
                            <input type="number" step="0.01" name="cgpa" class="form-control" min="0" max="10" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Phone *</label>
                            <input type="tel" name="phone" class="form-control" pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label>Resume <span class="text-muted small">(optional, PDF/DOC/DOCX)</span></label>
                            <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
                            <div class="form-text">You can also upload this later from your profile.</div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
