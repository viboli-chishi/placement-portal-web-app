{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4>Edit Profile</h4>
    <p class="text-muted small">Update your info and upload your resume here.</p>
    <hr>

    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" value="{{ student.name }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" class="form-control" value="{{ student.roll_number }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Branch</label>
        <input type="text" class="form-control" value="{{ student.branch }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Year *</label>
        <select name="year" class="form-select">
          {% for y in [1,2,3,4] %}
            <option value="{{ y }}" {% if student.year == y %}selected{% endif %}>Year {{ y }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">CGPA *</label>
        <input type="number" name="cgpa" step="0.01" min="0" max="10"
          class="form-control" value="{{ student.cgpa }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone *</label>
        <input type="tel" name="phone" class="form-control" value="{{ student.phone }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Resume (PDF/DOC/DOCX)</label>
        {% if student.resume_filename %}
          <p class="small text-muted mb-1">
            Current: <a href="{{ url_for('static', filename='uploads/' + student.resume_filename) }}" target="_blank">{{ student.resume_filename }}</a>
          </p>
        {% endif %}
        <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
        <div class="form-text">Max 16MB. Uploading a new file will replace the old one.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
