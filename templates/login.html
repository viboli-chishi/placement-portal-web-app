{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-black text-white text-center py-3">
                <h4 class="mb-0" style="background-color: black;">Login to Placement Portal</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>                   
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control"  placeholder="Enter password" required>
                    <button type="submit" class="btn btn-primary w-100" style="background-color: black; border-color: black;" >Login</button>
                </form>
            </div>
        </div>

        <div class="text-center">
            <p class="text-muted small">Don't have an account?
                <a href="{{ url_for('register_student') }}">Register as Student</a> or
                <a href="{{ url_for('register_company') }}">Register as Company</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
